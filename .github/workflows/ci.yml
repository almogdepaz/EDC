name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  hardening:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ReviewBench fixtures read the pinned runtime revision.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Run shellcheck
        run: npm run lint:shell
      - name: Run hardening suite
        env:
          REVIEWBENCH_TEST_GIT_FIXTURES: "1"
        run: npm test
      - name: Test ReviewBench gateway
        if: matrix.node-version == 24
        run: node --test benchmark/tests/test_reviewbench_gateway.mjs
      - name: Check npm package contents
        run: npm run pack:check
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Smoke-test the remote installer
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          work=$(mktemp -d)
          home=$(mktemp -d)
          cp install.sh "$work/install.sh"
          (
            cd "$work"
            HOME="$home" CI=1 SHELL=/bin/bash bash install.sh --agent claude --no-path
          )
          test -x "$home/.edc/scripts/edc"
          rm -rf "$work" "$home"

  hardening-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ReviewBench fixtures read the pinned runtime revision.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install system dependencies
        run: brew install jq shellcheck
      - name: Run shellcheck
        run: npm run lint:shell
      - name: Run hardening suite with Apple Bash
        shell: /bin/bash {0}
        env:
          REVIEWBENCH_TEST_GIT_FIXTURES: "1"
        run: npm test
      - name: Check npm package contents
        run: npm run pack:check
